zh_CN:
  daily_challenge:
    ai_notice:
      fallback_checkin: ">> [签到收到]❤ 哼，今天也有好好出现嘛，本小姐先给你记下了，明天可别偷偷溜走呀，杂鱼❤"
      fallback_reminder: ">> [还没出现呀]❤ 哼，本小姐可发现你还没来，今天的打卡贴已经备好了，忙完就回来冒个泡吧，杂鱼❤"
      checkin_facts: "**签到成功｜%{date}**\n\n活动：%{name}\n累计签到：**%{total} / %{needed} 次** · 连续签到：**%{streak} 天**\n\n[查看本次打卡](%{url})"
      reminder_facts: "活动：%{name}\n累计签到：**%{total} / %{needed} 次** · 最近签到：**%{last_date}**\n\n[进入今日打卡贴](%{url})"
    daily_topic:
      title: "%{name}｜%{date} 打卡"
      body: "**%{name}**\n\n今天是 **%{date}**（%{timezone}）。在今天结束前回复本帖即可签到，每人每天一次，无须填写 #标签或上传图片。\n\n本帖过期后仍可讨论，但跨天回复不计签到。活动目标：%{needed} 次签到。\n\n[浏览活动话题与每日打卡贴](%{url}) · 标签：%{tag}"
      weekly_title: "%{name}｜%{date} 每周榜单"
      final_title: "%{name}｜最终总结"
      weekly_footer: "请到今日打卡贴签到；本榜单的回复不计签到。"
    check_in:
      already_exists: "该用户在这一天已有签到记录。"
      already_exists_this_week: "该用户在这一周已有签到记录。"
    weekly_post:
      heading: "## 🏆 %{title} 每周进展"
      period: "本周：%{start} 至 %{finish}"
      days_elapsed: "第 **%{elapsed}** 天，共 **%{total}** 天"
      user: "参与者"
      check_ins: "签到次数"
      goal: "目标"
      progress: "完成进度"
      no_participants: "*暂无签到记录，快来成为第一个参与者吧！*"
      footer: "继续加油！回复签到标签或上传照片即可签到。🔥"
    final_post:
      heading: "## %{title} — 最终成绩 🏆"
      intro: "**#%{hashtag}** 挑战已结束，以下是最终成绩！"
      eligible_header: "### 完成挑战的参与者"
      row: "- %{medal}@%{username} — 签到 %{count} 次"
      congrats: "🏆 恭喜所有完成挑战的参与者！"
      no_completions: "*本次没有参与者达到 %{needed} 次签到的目标，感谢大家的参与！*"
      summary: "**%{total} 位参与者中有 %{completed} 位**达到 %{needed} 次签到的目标，完成了挑战。"
    badge:
      description_with_topic: "授予在“%{title}”中完成全部所需签到的参与者。"
      description_fallback: "授予成功完成挑战的参与者。"
    errors:
      access_denied: "你没有管理此挑战的权限。"
      badge_name_required: "颁发挑战完成徽章时，必须填写徽章名称。"
      category_access_denied: "你只能在自己管理的分类中创建挑战。"
    bot:
      onboarding_dm_title: "欢迎参加“%{challenge_name}”挑战！"
      onboarding_dm_body: |
        你已加入挑战！以下是活动信息：

        - **话题标签：** %{hashtag}（在当日打卡贴回复即可签到）
        - **达标所需签到次数：** %{check_ins_needed}
        - **活动结束日期：** %{end_date}

        **@%{bot_username} 指令** — 回复此消息或随时给我发送私信：
        - `status` — 查看所有进行中挑战的个人统计
        - `progress` — 查看签到进度和剩余时间
        - `leaderboard` — 查看当前排行榜
        - `streak` — 查看连续签到记录
        - `checkins` — 查看全部签到日期
        - `help` — 查看所有指令
      checkin_dm_title: "签到成功！"
      checkin_dm_body: |
        ✅ 已记录你在 %{topic_link} 的签到！

        当前连续签到：**%{streak_text}** 🔥
        完成进度：已签到 **%{check_ins} 次，目标 %{needed} 次**
      checkin_dm_body_first: |
        🎉 欢迎参加挑战！已记录你在 %{topic_link} 的首次签到。开了个好头，继续保持！

        完成挑战需要签到 **%{needed} 次**，加油！✨
      completion_dm_title: "挑战完成！🏆"
      completion_dm_body_with_badge: |
        🏆 太棒了！你已在 %{topic_link} 中完成 **%{check_ins}**，达成挑战目标！

        你已获得 **%{badge_name}** 徽章的领取资格，徽章将在活动结束后颁发。感谢你的坚持！🎉
      completion_dm_body: |
        🏆 太棒了！你已在 %{topic_link} 中完成 **%{check_ins}**，达成挑战目标！

        感谢你的坚持，恭喜完成挑战！🎉
      reminder_dm_title: "别忘了签到 — %{challenge_name}"
      checkin_count:
        other: "%{count} 次签到"
      reminder_dm_body: |
        👋 你已经有几天没在 %{topic_link} 签到了。目前已完成 **%{checkin_count}**，目标是 **%{needed} 次**。继续加油！
      reminder_dm_body_2: |
        👋 距离你上次在 %{topic_link} 签到已经一周了，现在回来还不晚！目前已完成 **%{checkin_count}**，目标是 **%{needed} 次**。期待你的回归！
      rate_limit_dm_title: "请稍等一下！"
      rate_limit_dm_body: "你发送指令过于频繁，请稍后再试。"
      streak_day:
        other: "连续 %{count} 天"
      streak_week:
        other: "连续 %{count} 周"
      mention_dm_title: "回复：%{command} — %{challenge_name}"
      dm:
        no_active_challenges: "你目前没有参与进行中的挑战。"
        picker_prompt: |
          你正在参与多个挑战。请回复数字选择其中一个，或回复 **A** 查看全部：

          %{challenges}

          指令：`%{command}`
        picker_invalid: |
          请回复有效的数字，或回复 **A** 查看全部。以下是你参与的挑战：

          %{challenges}

          指令：`%{command}`
        drawing_no_access: "你没有生成抽奖名单的权限，此指令仅对挑战管理员开放。"
        drawing_none: "“%{challenge}”中没有参与者达到至少 %{min_checkins} 次签到的条件。"
        drawing_count:
          other: "%{count} 人符合抽奖条件"
      commands:
        status_header: "**你参与的进行中挑战：**"
        status_row: "- **%{challenge}** — 签到 %{check_ins} 次 · %{streak} · 已完成 %{pct}%"
        status_none: "你尚未参与任何进行中的挑战。"
        leaderboard_header: "**%{challenge} 当前排行榜**（前 10 名）："
        leaderboard_row: "%{rank}. @%{username} — 签到 %{count} 次"
        leaderboard_none: "暂无签到记录。"
        streak_message: "你在 **%{challenge}** 中的连续签到：**%{streak_text}** 🔥"
        streak_none: "你还没有在 **%{challenge}** 中签到。"
        checkins_header: "**你在 %{challenge} 中的签到记录**（共 %{count} 次）："
        checkins_row: "- %{date}"
        checkins_none: "暂无签到记录。"
        progress_message: |
          **%{challenge} 的完成进度**

          - 签到次数：%{done} / %{needed}
          - %{time_remaining}
          - 状态：%{status}
        progress_time_remaining_day:
          other: "剩余 %{count} 天"
        progress_time_remaining_week:
          other: "剩余 %{count} 周"
        progress_on_track: "进度正常 ✅"
        progress_behind: "进度落后，继续加油！⏩"
        progress_complete: "已达成目标！🏆"
        unknown_command: "未识别的指令，你可以使用以下指令："
        help: |
          **@%{bot_username} 指令：**

          - `status` — 查看所有进行中挑战的个人统计
          - `leaderboard` — 查看此挑战的前 10 名
          - `streak` — 查看连续签到记录
          - `checkins` — 查看全部签到日期
          - `progress` — 查看签到进度和剩余时间
          - `help` — 显示此帮助消息
  site_settings:
    daily_challenge_notification_ai_agent_id: "用于签到成功及漏签提醒私信的 AI 智能体 ID；0 使用原固定文案。邮件沿用用户通知偏好。"
    daily_challenge_enabled: "启用挑战活动插件"
    daily_challenge_mod_access_enabled: "允许全站版主管理挑战活动"
    daily_challenge_category_mod_access_enabled: "允许分类版主管理所属分类的挑战活动"
    daily_challenge_bot_username: "发布每日打卡贴、签到确认、提醒和指令回复的机器人用户名。每日独立话题活动必须配置可用机器人。"
